# No USB anywhere in this file, deliberately. The nRF54L15 has no USB device
# controller -- within the nRF54L family that is the LM20A and LM20B only --
# so the host is reached through the board's SAMD11 CMSIS-DAP bridge over a
# UART. Nordic's own 802154_sniffer sample configures CDC-ACM and cannot run
# here for exactly that reason.

CONFIG_SERIAL=y
# link.c hands whole spans to EasyDMA (uart_tx) and receives asynchronously
# (uart_rx_enable), which needs this API rather than the interrupt-driven one.
# Two reasons, both measured: DMA reaches 94% of line rate where per-byte
# uart_poll_out reached 78%, and sn_link_send() no longer blocks its caller --
# which is the radio driver's RX thread. At 115200 a 130-byte frame used to
# hold that thread for about 11 ms. See docs/2026-09-14-nrf54l15-spike.md.
#
# Without this the build still succeeds and the board says nothing at all:
# uart_callback_set() returns -ENOTSUP, sn_link_init() fails, main() returns.
CONFIG_UART_ASYNC_API=y

# The capture stream owns the UART. There is only one, so anything else
# writing to it puts unframed bytes into the data path -- which is precisely
# what test_no_unframed_bytes_once_synchronised fails you for. This is not
# tidiness; it is the reason that test exists.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_PRINTK=n

# Logging travels inside the frame protocol, never to the UART directly.
# LOG_BACKEND_UART=n is the point of the exercise: leaving it on would put raw
# text in the middle of the capture stream.
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_MODE_DEFERRED=y
# Compiles log_output.c, which the custom backend formats through. Normally a
# built-in backend selects it; there is no built-in backend here, so it has to
# be asked for.
CONFIG_LOG_OUTPUT=y

# Not optional, and not a performance tweak.
#
# The driver's RX thread defaults to 800 bytes and was measured at 792 used.
# Anything that adds to that stack stops reception -- silently: start()
# returns 0, the channel reads back, promiscuous reads back true, and no frame
# ever arrives. Enabling logging is exactly the kind of thing that adds to it,
# which is why this sits directly beneath the CONFIG_LOG above. Deferred mode
# keeps formatting off that thread; this is the margin that does not depend on
# that remaining true. See docs/2026-09-14-nrf54l15-spike.md.
CONFIG_IEEE802154_NRF5_RX_STACK_SIZE=2048

CONFIG_MAIN_STACK_SIZE=4096

# CONFIG_REGULATOR and CONFIG_REGULATOR_FIXED come from the board's own
# defconfig and must not be turned off: they are what drives rfsw_pwr and
# rfsw_ctl at boot. Without them the RF switch is unpowered and the radio
# reaches its antenna only through leakage -- the same failure
# firmware/main/board.h documents on the C6.

# The radio. These values are the ones Nordic's own 802154_sniffer sample
# uses, read from the installed SDK rather than remembered -- except
# RX_BUFFERS, which their sample sets to 120 for an nRF52840. 16 is plenty
# here and was what reception was finally proved with.
#
# Reception on this part is NOT supported by Nordic and was hard-won. Two
# binaries with byte-identical Kconfig were found to differ deterministically,
# so if frames stop arriving after an unrelated change, read
# docs/2026-09-14-nrf54l15-spike.md before suspecting anything else.
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=3
CONFIG_NRF_802154_RX_BUFFERS=16
